<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador FB - Sen. Ivideliza Reyes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0?bundle&external=react",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#64748b;">
            <div style="width:40px; height:40px; border:4px solid #8b5cf6; border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top:20px; font-weight:bold;">Cargando Rastreador de Temas...</p>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Search, Facebook, Database, Settings, LogOut, Target, CheckCircle2, Copy, AlertTriangle, Key, Loader2, Save, History, FileText, Star, TrendingUp, X } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, serverTimestamp, deleteDoc } from 'firebase/firestore';

        // --- CREDENCIALES DE FIREBASE (Las mismas de tu proyecto original) ---
        const firebaseConfig = {
            apiKey: "AIzaSyA7xjysJVQb3tYEb8ZU9yHbs-MBDWVUhk4",
            authDomain: "gestor-ivi.firebaseapp.com",
            projectId: "gestor-ivi",
            storageBucket: "gestor-ivi.firebasestorage.app",
            messagingSenderId: "562230194451",
            appId: "1:562230194451:web:3877b3bf0d18b6ac912ae6",
            measurementId: "G-5MDJNBV15H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const appId = firebaseConfig.projectId;

        const ALLOWED_EMAIL = "luixnay@gmail.com";
        const isAllowedUser = (firebaseUser) => {
            return firebaseUser && firebaseUser.email.trim().toLowerCase() === ALLOWED_EMAIL && firebaseUser.emailVerified === true;
        };

        // --- FUNCIÓN GEMINI ---
        const GEMINI_MODEL = "gemini-2.5-flash";
        const fetchGemini = async (payload, apiKey) => {
            const cleanApiKey = (apiKey || "").trim().replace(/^['"]|['"]$/g, "");
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cleanApiKey },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Error en la API de Gemini. Revisa tu Key o cuota.");
            return await response.json();
        };

        const copyToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(textArea);
        };

        function App() {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [loginError, setLoginError] = useState("");
            
            const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_api_key') || "");
            const [fbToken, setFbToken] = useState(localStorage.getItem('fb_api_token') || "");
            const [fbPageId, setFbPageId] = useState(localStorage.getItem('fb_page_id') || "");

            const [temaBuscar, setTemaBuscar] = useState("");
            const [datosCrudos, setDatosCrudos] = useState("");
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");
            
            const [resultadosActuales, setResultadosActuales] = useState(null);
            const [historialAnalisis, setHistorialAnalisis] = useState([]);
            const [viewingHistoryId, setViewingHistoryId] = useState(null);
            const [activeTab, setActiveTab] = useState('manual'); // 'manual' o 'auto'

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    if (currentUser && !isAllowedUser(currentUser)) {
                        setUser(null);
                        setLoginError(`Acceso denegado. Usuario no autorizado.`);
                        await signOut(auth);
                        setAuthLoading(false);
                        return;
                    }
                    setUser(currentUser);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const analisisRef = collection(db, 'artifacts', appId, 'users', user.uid, 'seguimiento_temas');
                const unsub = onSnapshot(analisisRef, (snap) => {
                    const fetched = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    fetched.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    setHistorialAnalisis(fetched);
                }, (err) => console.error("Error Firebase:", err));
                return () => unsub();
            }, [user]);

            const handleLogin = async () => {
                setLoginError("");
                try {
                    const result = await signInWithPopup(auth, provider);
                    if (!isAllowedUser(result.user)) {
                        await signOut(auth);
                        setUser(null);
                        setLoginError("Acceso denegado. Usuario no autorizado.");
                    }
                } catch (error) { setLoginError("Error: " + error.message); }
            };

            const saveKeys = () => {
                localStorage.setItem('gemini_api_key', geminiKey);
                localStorage.setItem('fb_api_token', fbToken);
                localStorage.setItem('fb_page_id', fbPageId);
                setIsConfigModalOpen(false);
            };

            const fetchFacebookData = async () => {
                if (!fbToken || !fbPageId) {
                    throw new Error("Falta el Token o el ID de la página de Facebook en la configuración.");
                }
                // Simulación de llamada a Graph API (Requiere permisos de lectura de página)
                // const url = `https://graph.facebook.com/v19.0/${fbPageId}/posts?fields=message,created_time,comments{message,from}&access_token=${fbToken}`;
                throw new Error("Conexión a FB API requiere token válido. Por favor, usa el Modo Manual por ahora.");
            };

            const analizarTema = async () => {
                if (!temaBuscar.trim()) { setErrorMsg("Por favor, ingresa un tema a buscar."); return; }
                if (activeTab === 'manual' && !datosCrudos.trim()) { setErrorMsg("Pega los datos a analizar."); return; }
                if (!geminiKey) { setIsConfigModalOpen(true); return; }

                setIsAnalyzing(true);
                setErrorMsg("");
                setResultadosActuales(null);

                try {
                    let textoAAnalizar = datosCrudos;

                    if (activeTab === 'auto') {
                        textoAAnalizar = await fetchFacebookData(); // Esto lanzará error hasta configurar FB Real
                    }

                    const prompt = `
                        Actúa como Analista de Datos Políticos y Escucha Social.
                        Se te proporcionará un volcado de texto que contiene varias publicaciones de Facebook y sus respectivos comentarios.
                        
                        TEMA A RASTREAR: "${temaBuscar}"
                        
                        TU TAREA:
                        1. Escanea el texto y ENCUENTRA ÚNICAMENTE las publicaciones que hablen o se relacionen directa o indirectamente con el TEMA A RASTREAR.
                        2. Extrae un resumen de esas publicaciones relevantes.
                        3. De los comentarios asociados a esas publicaciones, SELECCIONA LOS 5 MEJORES COMENTARIOS. Buscamos comentarios positivos, constructivos, testimonios de apoyo o defensas ciudadanas que puedan servir para darles visibilidad (compartirlos o hacer un diseño con ellos).
                        
                        TEXTO A ANALIZAR:
                        ${textoAAnalizar}

                        Devuelve el resultado ESTRICTAMENTE en este formato JSON:
                        {
                            "publicacionesRelevantes": [
                                { "fragmentoPost": "texto de la publicación encontrada", "impactoDetectado": "breve análisis de cómo se recibió" }
                            ],
                            "mejoresComentarios": [
                                { "nombre": "Nombre del usuario (si se detecta)", "comentario": "Texto exacto del comentario", "motivoSeleccion": "Por qué es un buen comentario para dar seguimiento o visibilidad" }
                            ],
                            "resumenGeneral": "Un párrafo resumiendo la percepción general de la gente sobre este tema específico."
                        }
                    `;

                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const data = await fetchGemini(payload, geminiKey);
                    const jsonResult = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);

                    setResultadosActuales(jsonResult);

                    // Guardar en Firebase para el historial
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'seguimiento_temas'), {
                        tema: temaBuscar,
                        resultados: jsonResult,
                        createdAt: serverTimestamp()
                    });

                } catch (error) {
                    setErrorMsg(error.message);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const eliminarHistorial = async (id, e) => {
                e.stopPropagation();
                if(confirm("¿Eliminar este análisis del historial?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'seguimiento_temas', id));
                    if (viewingHistoryId === id) setViewingHistoryId(null);
                }
            };

            if (authLoading) return null;

            if (!user) {
                return (
                    <div className="flex items-center justify-center h-screen bg-slate-100">
                        <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border-2 border-purple-100">
                            <Target className="w-12 h-12 text-purple-600 mx-auto mb-4" />
                            <h1 className="text-2xl font-black text-slate-800 mb-2">Rastreador FB</h1>
                            <p className="text-slate-500 mb-6 text-sm">Escucha social y rescate de comentarios positivos.</p>
                            {loginError && <p className="text-red-500 text-xs mb-4">{loginError}</p>}
                            <button onClick={handleLogin} className="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold transition-all shadow-md">
                                Ingresar
                            </button>
                        </div>
                    </div>
                );
            }

            const renderResultados = (data) => {
                if (!data) return null;
                return (
                    <div className="space-y-6 animate-in fade-in duration-500">
                        <div className="bg-purple-50 border border-purple-200 p-5 rounded-2xl">
                            <h3 className="text-sm font-bold text-purple-800 uppercase tracking-wider mb-2 flex items-center gap-2"><TrendingUp className="w-4 h-4"/> Resumen General del Tema</h3>
                            <p className="text-slate-700">{data.resumenGeneral}</p>
                        </div>

                        <div>
                            <h3 className="font-bold text-slate-800 text-lg mb-3 border-b pb-2">Publicaciones Encontradas</h3>
                            {data.publicacionesRelevantes?.length === 0 ? (
                                <p className="text-slate-500 text-sm">No se encontraron publicaciones relevantes en los datos proporcionados.</p>
                            ) : (
                                <div className="grid gap-3">
                                    {data.publicacionesRelevantes?.map((pub, idx) => (
                                        <div key={idx} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                                            <p className="text-sm text-slate-600 italic">"{pub.fragmentoPost}"</p>
                                            <div className="bg-blue-50 p-2 rounded-lg border border-blue-100">
                                                <p className="text-xs font-bold text-blue-700">Impacto detectado:</p>
                                                <p className="text-xs text-blue-900">{pub.impactoDetectado}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div>
                            <h3 className="font-bold text-amber-600 text-lg mb-3 border-b pb-2 flex items-center gap-2"><Star className="w-5 h-5"/> Mejores Comentarios para Rescatar</h3>
                            <p className="text-xs text-slate-500 mb-4">Estos comentarios muestran apoyo fuerte al tema y son ideales para crear diseños gráficos, videos o historias de seguimiento.</p>
                            
                            {data.mejoresComentarios?.length === 0 ? (
                                <p className="text-slate-500 text-sm">No se encontraron comentarios destacables.</p>
                            ) : (
                                <div className="space-y-4">
                                    {data.mejoresComentarios?.map((com, idx) => (
                                        <div key={idx} className="bg-white border-2 border-amber-100 rounded-xl p-4 shadow-sm relative group">
                                            <div className="flex justify-between items-start mb-2">
                                                <span className="font-bold text-slate-800 bg-slate-100 px-2 py-1 rounded text-sm">{com.nombre || "Usuario"}</span>
                                                <button onClick={() => copyToClipboard(com.comentario)} className="text-xs bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-700 px-2 py-1 rounded flex items-center gap-1 transition-colors">
                                                    <Copy className="w-3 h-3"/> Copiar Texto
                                                </button>
                                            </div>
                                            <p className="text-lg text-slate-700 font-medium mb-3">"{com.comentario}"</p>
                                            <div className="flex items-start gap-2 text-xs bg-amber-50 p-2 rounded-lg text-amber-800 border border-amber-200">
                                                <CheckCircle2 className="w-4 h-4 shrink-0 mt-0.5"/>
                                                <p><b>¿Por qué usarlo?</b> {com.motivoSeleccion}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    {/* SIDEBAR HISTORIAL */}
                    <aside className="w-80 bg-white border-r border-slate-200 flex flex-col hidden md:flex">
                        <div className="p-4 border-b border-slate-200 bg-purple-50">
                            <h2 className="text-purple-900 font-black text-lg flex items-center gap-2"><History className="w-5 h-5" /> Análisis Guardados</h2>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            <button onClick={() => { setViewingHistoryId(null); setResultadosActuales(null); setTemaBuscar(""); }} className="w-full mb-4 py-3 rounded-xl border-2 border-dashed border-purple-300 text-purple-600 font-bold hover:bg-purple-50 transition-colors">
                                + Nuevo Seguimiento
                            </button>
                            {historialAnalisis.map(item => (
                                <div key={item.id} onClick={() => { setViewingHistoryId(item.id); setResultadosActuales(null); }} className={`p-3 rounded-xl border cursor-pointer group relative transition-all ${viewingHistoryId === item.id ? 'bg-purple-600 text-white border-purple-700 shadow-md' : 'bg-white border-slate-200 hover:border-purple-300 text-slate-700 hover:bg-slate-50'}`}>
                                    <p className="font-bold text-sm line-clamp-1 pr-6">{item.tema}</p>
                                    <p className={`text-[10px] mt-1 ${viewingHistoryId === item.id ? 'text-purple-200' : 'text-slate-400'}`}>
                                        {item.createdAt?.toDate().toLocaleDateString()}
                                    </p>
                                    <button onClick={(e) => eliminarHistorial(item.id, e)} className={`absolute top-2 right-2 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity ${viewingHistoryId === item.id ? 'hover:bg-purple-500 text-purple-200 hover:text-white' : 'hover:bg-red-50 text-slate-300 hover:text-red-500'}`}>
                                        <X className="w-4 h-4"/>
                                    </button>
                                </div>
                            ))}
                        </div>
                    </aside>

                    {/* ÁREA PRINCIPAL */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden">
                        <header className="bg-white border-b border-slate-200 p-4 flex justify-between items-center shrink-0">
                            <div className="flex items-center gap-3">
                                <div className="bg-purple-100 p-2 rounded-lg"><Target className="w-6 h-6 text-purple-600"/></div>
                                <div>
                                    <h1 className="font-black text-slate-800 leading-tight">Radar de Seguimiento</h1>
                                    <p className="text-xs text-slate-500">Módulo de Escucha Social</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsConfigModalOpen(true)} className="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2" title="Configurar API Keys">
                                    <Settings className="w-5 h-5"/> <span className="text-xs font-bold hidden md:inline">Conexiones</span>
                                </button>
                                <button onClick={() => signOut(auth)} className="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-100 transition-colors"><LogOut className="w-5 h-5"/></button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
                            <div className="max-w-4xl mx-auto">
                                
                                {errorMsg && (
                                    <div className="mb-6 bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-center gap-3 shadow-sm">
                                        <AlertTriangle className="w-5 h-5 shrink-0"/> <p className="text-sm font-medium">{errorMsg}</p>
                                    </div>
                                )}

                                {/* VISTA: NUEVO ANÁLISIS */}
                                {!viewingHistoryId && !resultadosActuales && (
                                    <div className="space-y-6 animate-in fade-in zoom-in-95 duration-300">
                                        
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <label className="block text-sm font-bold text-purple-900 mb-2 uppercase tracking-wider">1. ¿Qué tema quieres rastrear?</label>
                                            <input 
                                                type="text" 
                                                value={temaBuscar} 
                                                onChange={e => setTemaBuscar(e.target.value)} 
                                                placeholder="Ej: Iniciativa para apoyar a pescadores, Ley de movilidad, Visita a Santiago..." 
                                                className="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-50 outline-none text-lg text-slate-800 transition-all shadow-inner"
                                            />
                                        </div>

                                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                            <div className="flex border-b border-slate-200 bg-slate-50">
                                                <button onClick={() => setActiveTab('manual')} className={`flex-1 py-4 text-sm font-bold flex items-center justify-center gap-2 transition-colors ${activeTab === 'manual' ? 'bg-white text-purple-700 border-b-2 border-purple-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                                    <FileText className="w-4 h-4"/> Modo Manual (Pegar texto)
                                                </button>
                                                <button onClick={() => setActiveTab('auto')} className={`flex-1 py-4 text-sm font-bold flex items-center justify-center gap-2 transition-colors ${activeTab === 'auto' ? 'bg-white text-blue-700 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                                    <Facebook className="w-4 h-4"/> Conectar a Facebook
                                                </button>
                                            </div>

                                            <div className="p-6">
                                                {activeTab === 'manual' ? (
                                                    <div>
                                                        <label className="block text-sm font-bold text-slate-700 mb-2">2. Pega publicaciones y comentarios aquí:</label>
                                                        <p className="text-xs text-slate-500 mb-3">Ve a tu página de Facebook, copia el texto de varias publicaciones junto con sus comentarios, y pégalo todo junto aquí. La IA se encargará de ordenarlo y buscar el tema.</p>
                                                        <textarea 
                                                            value={datosCrudos}
                                                            onChange={e => setDatosCrudos(e.target.value)}
                                                            placeholder="Pega el texto aquí..."
                                                            className="w-full h-48 p-4 rounded-xl border border-slate-300 focus:border-purple-500 outline-none resize-none text-sm text-slate-700"
                                                        />
                                                    </div>
                                                ) : (
                                                    <div className="text-center py-8">
                                                        <div className="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><Facebook className="w-8 h-8 text-blue-600"/></div>
                                                        <h3 className="font-bold text-slate-800 mb-2">Búsqueda Automática en tu Página</h3>
                                                        <p className="text-sm text-slate-500 mb-6 max-w-md mx-auto">Para usar esta función, necesitas configurar el Access Token de Meta for Developers en las opciones de "Conexiones".</p>
                                                        <button onClick={() => setIsConfigModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold text-sm shadow-sm transition-colors">Configurar Conexión FB</button>
                                                    </div>
                                                )}

                                                <div className="mt-6 flex justify-end">
                                                    <button onClick={analizarTema} disabled={isAnalyzing || !temaBuscar.trim()} className="w-full md:w-auto bg-purple-900 hover:bg-purple-950 text-white px-8 py-4 rounded-xl font-black text-lg disabled:opacity-50 transition-all flex items-center justify-center gap-3 shadow-lg hover:shadow-xl hover:-translate-y-1">
                                                        {isAnalyzing ? <><Loader2 className="w-6 h-6 animate-spin"/> Analizando datos...</> : <><Search className="w-6 h-6"/> Buscar y Analizar Tema</>}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* VISTA: RESULTADOS ACTUALES O HISTORIAL */}
                                {(resultadosActuales || viewingHistoryId) && (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                            <div>
                                                <p className="text-xs font-bold text-purple-600 uppercase">Tema Rastreado:</p>
                                                <h2 className="text-xl font-black text-slate-800">{viewingHistoryId ? historialAnalisis.find(h => h.id === viewingHistoryId)?.tema : temaBuscar}</h2>
                                            </div>
                                            <button onClick={() => { setViewingHistoryId(null); setResultadosActuales(null); setTemaBuscar(""); }} className="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg font-bold transition-colors">
                                                Cerrar y Volver
                                            </button>
                                        </div>

                                        {viewingHistoryId 
                                            ? renderResultados(historialAnalisis.find(h => h.id === viewingHistoryId)?.resultados)
                                            : renderResultados(resultadosActuales)
                                        }
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* MODAL CONFIGURACIÓN API KEYS */}
                    {isConfigModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h2 className="font-bold flex items-center gap-2 text-slate-800"><Key className="w-5 h-5 text-slate-500"/> Conexiones API</h2>
                                    <button onClick={() => setIsConfigModalOpen(false)}><X className="w-6 h-6 text-slate-400 hover:text-slate-600"/></button>
                                </div>
                                
                                <div className="p-6 space-y-6">
                                    {/* GEMINI */}
                                    <div>
                                        <label className="block text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                                            <Target className="w-4 h-4 text-purple-500"/> Google Gemini API Key
                                        </label>
                                        <p className="text-[10px] text-slate-500 mb-2">Necesaria para la Inteligencia Artificial (Es la misma llave de tu app principal).</p>
                                        <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-3 rounded-lg border border-slate-300 focus:border-purple-500 outline-none text-sm font-mono"/>
                                    </div>

                                    <div className="border-t border-slate-100 pt-6">
                                        <label className="block text-sm font-bold text-slate-800 mb-1 flex items-center gap-2">
                                            <Facebook className="w-4 h-4 text-blue-600"/> Conexión Facebook Graph API (Opcional)
                                        </label>
                                        <p className="text-[10px] text-slate-500 mb-3">Si deseas extracción automática, ingresa los datos de tu App de Meta For Developers.</p>
                                        
                                        <div className="space-y-3">
                                            <div>
                                                <p className="text-xs font-bold text-slate-600 mb-1">Page Access Token</p>
                                                <input type="password" value={fbToken} onChange={e => setFbToken(e.target.value)} placeholder="EAA..." className="w-full p-2 rounded-lg border border-slate-300 focus:border-blue-500 outline-none text-xs font-mono"/>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-600 mb-1">Facebook Page ID</p>
                                                <input type="text" value={fbPageId} onChange={e => setFbPageId(e.target.value)} placeholder="1234567890..." className="w-full p-2 rounded-lg border border-slate-300 focus:border-blue-500 outline-none text-xs font-mono"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t bg-slate-50 flex justify-end gap-3">
                                    <button onClick={() => setIsConfigModalOpen(false)} className="px-5 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded-lg">Cancelar</button>
                                    <button onClick={saveKeys} className="px-6 py-2 bg-slate-900 text-white font-bold rounded-lg hover:bg-black shadow-sm flex items-center gap-2"><Save className="w-4 h-4"/> Guardar Conexiones</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
